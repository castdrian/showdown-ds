plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseKeystorePath = System.getenv('SHOWDOWN_KEYSTORE_PATH')
def releaseVersionName = System.getenv('SHOWDOWN_VERSION_NAME') ?: '0.1.0'
def releaseVersionCode = (System.getenv('SHOWDOWN_VERSION_CODE') ?: '1').toInteger()

android {
    namespace 'dev.adrian.showdown'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.adrian.showdown'
        minSdk 26
        targetSdk 34
        versionCode releaseVersionCode
        versionName releaseVersionName

    }

    signingConfigs {
        release {
            if (releaseKeystorePath != null) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('SHOWDOWN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SHOWDOWN_KEY_ALIAS')
                keyPassword System.getenv('SHOWDOWN_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp-jvm:5.5.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
}
