name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"

      - name: Install Gradle
        run: |
          curl --fail --silent --show-error --location "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Showdown protocol contracts
        run: |
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest \
            --tests dev.adrian.showdown.OfficialBattleTranscriptTest \
            --tests dev.adrian.showdown.ShowdownProtocolContractTest \
            --tests dev.adrian.showdown.ShowdownSocketFramesTest \
            --tests dev.adrian.showdown.ShowdownServerEndpointTest \
            --tests dev.adrian.showdown.ShowdownAssetPathsTest

      - name: Run full unit suite and build debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showdown-ds-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: showdown-ds-debug
          path: app/build/outputs/apk/debug/app-debug.apk
