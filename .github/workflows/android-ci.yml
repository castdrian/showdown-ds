name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Validate README screenshots
        run: go run scripts/validate-readme-media.go

      - name: Test README screenshot validation
        run: go test scripts/*.go

      - name: Test Showdown battle-data generator
        run: go test tools/showdown-battle-data/*.go

      - name: Test Thor screenshot composer
        run: go test tools/compose-thor-screenshot/*.go

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'

      - name: Install Android build dependencies
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.3.13750724"

      - name: Install Gradle
        run: |
          curl --fail --silent --show-error --location "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js for the upstream server
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check out the upstream Showdown server
        uses: actions/checkout@v7
        with:
          repository: smogon/pokemon-showdown
          ref: 942cda71d14bf0618bd57991708a2e2734b6daba
          path: upstream-pokemon-showdown

      - name: Install upstream Showdown server dependencies
        working-directory: upstream-pokemon-showdown
        run: npm ci --no-audit --no-fund

      - name: Configure upstream Showdown for local compatibility tests
        working-directory: upstream-pokemon-showdown
        run: cp ../tools/showdown-upstream-ci/config.js config/config.js

      - name: Verify native connection against upstream Showdown
        env:
          SHOWDOWN_TEST_SERVER_URL: ws://127.0.0.1:8000/showdown/websocket
        run: |
          cd upstream-pokemon-showdown
          node pokemon-showdown 8000 > "$RUNNER_TEMP/showdown-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              tail -n 100 "$RUNNER_TEMP/showdown-server.log"
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              tail -n 100 "$RUNNER_TEMP/showdown-server.log"
              exit 1
            fi
            sleep 1
          done
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest \
            --tests dev.adrian.showdown.ShowdownUpstreamServerCompatibilityTest

      - name: Validate Showdown protocol contracts
        run: |
          gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest \
            --tests dev.adrian.showdown.OfficialBattleTranscriptTest \
            --tests dev.adrian.showdown.ShowdownProtocolContractTest \
            --tests dev.adrian.showdown.ShowdownSocketFramesTest \
            --tests dev.adrian.showdown.ShowdownServerEndpointTest \
            --tests dev.adrian.showdown.ShowdownAssetPathsTest

      - name: Run full unit suite and build debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          heap-size: 512M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: gradle --no-daemon --stacktrace --console=plain :app:connectedDebugAndroidTest

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: showdown-ds-test-results
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: showdown-ds-debug
          path: app/build/outputs/apk/debug/app-debug.apk
